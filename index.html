<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase 0 検証アプリ</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f3a5f">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; color: #222; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 14px; background: #1f3a5f; color: #fff; font-size: 14px; }
  header .spacer { flex: 1; }
  main, section { padding: 14px; max-width: 640px; margin: 0 auto; }
  input, textarea, button { font-size: 16px; padding: 10px; margin: 4px 0; width: 100%; box-sizing: border-box; }
  button { background: #1f3a5f; color: #fff; border: 0; border-radius: 6px; min-height: 48px; cursor: pointer; }
  button.sub { background: #e8ecf1; color: #222; }
  header button { width: auto; min-height: 36px; padding: 6px 12px; background: #35507a; }
  ul { padding-left: 18px; }
  li { margin: 6px 0; font-size: 14px; word-break: break-all; }
  .photos { display: flex; flex-wrap: wrap; gap: 8px; }
  .photos img { width: 104px; height: 104px; object-fit: cover; border-radius: 6px; background: #eee; }
  .msg { font-size: 14px; color: #b00; min-height: 1em; }
  .note { font-size: 12px; color: #666; }
  h1 { font-size: 20px; } h2 { font-size: 18px; } h3 { font-size: 16px; margin-top: 24px; }
</style>
</head>
<body>
<header>
  <span id="netStatus">オフライン</span>
  <span id="syncStatus" hidden>同期中</span>
  <span class="spacer"></span>
  <span id="userEmail"></span>
  <button id="logoutBtn" hidden>ログアウト</button>
</header>

<!-- ログイン -->
<section id="authView">
  <h1>Phase 0 検証用</h1>
  <input id="email" type="email" placeholder="メールアドレス" autocomplete="username">
  <input id="password" type="password" placeholder="パスワード" autocomplete="current-password">
  <button id="loginBtn">ログイン</button>
  <button id="signupBtn" class="sub">新規登録</button>
  <div id="companySetup" hidden>
    <p class="note">所属会社のIDを登録してください（検証用。例：company-a）</p>
    <input id="companyIdInput" type="text" value="company-a">
    <button id="saveCompanyBtn">会社IDを登録</button>
  </div>
  <p id="authMsg" class="msg"></p>
</section>

<!-- 検証画面 -->
<main id="appView" hidden>
  <h2 id="projectTitle">テスト案件</h2>

  <label for="memo">メモ</label>
  <textarea id="memo" rows="6"></textarea>
  <button id="saveBtn">保存</button>
  <p id="saveMsg" class="msg"></p>

  <h3>変更履歴</h3>
  <ul id="historyList"></ul>

  <h3>写真</h3>
  <button id="photoPickBtn" class="sub">写真を選ぶ</button>
  <button id="cameraBtn" class="sub">撮影</button>
  <input id="photoInput" type="file" accept="image/*" hidden>
  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
  <p id="queueMsg" class="note"></p>
  <div id="photoList" class="photos"></div>

  <p class="note">検証用サンプルです。実データは入れないでください。</p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getAuth, connectAuthEmulator, onAuthStateChanged,
  signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  connectFirestoreEmulator,
  doc, getDoc, setDoc, updateDoc, onSnapshot,
  collection, addDoc, query, orderBy, limit, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import {
  getStorage, connectStorageEmulator, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js";

/* =====================================================================
   ★ firebaseConfig の差し替え場所 ★
   Firebaseコンソールでウェブアプリを登録すると表示される
   firebaseConfig の中身を、そのまま下に貼り付けてください。
   （手順は README.md の「3. firebaseConfig を貼る」参照）
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyClK5a2zMvIoWjr7AuaNITUoI2Ocs_X5iM",
  authDomain: "renove-app-dev.firebaseapp.com",
  projectId: "renove-app-dev",
  storageBucket: "renove-app-dev.firebasestorage.app",
  messagingSenderId: "83245060702",
  appId: "1:83245060702:web:1785c88bbebbf1458adacf"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
// オフライン永続化（端末内にキャッシュし、圏外でも読み書きできるようにする）
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});
const storage = getStorage(app);

// ローカル確認用：URLに ?emulator=1 を付けたときだけエミュレータへ接続する
if (new URLSearchParams(location.search).has("emulator")) {
  connectAuthEmulator(auth, "http://127.0.0.1:9099", { disableWarnings: true });
  connectFirestoreEmulator(db, "127.0.0.1", 8080);
  connectStorageEmulator(storage, "127.0.0.1", 9199);
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

/* ---------- 通信状態の表示（「オンライン」「オフライン」「同期中」のみ） ---------- */
const netStatusEl = document.getElementById("netStatus");
const syncStatusEl = document.getElementById("syncStatus");
let pendingLocalWrites = false;
let activeOps = 0;

function refreshNet() {
  netStatusEl.textContent = navigator.onLine ? "オンライン" : "オフライン";
}
function refreshSync() {
  syncStatusEl.hidden = !(pendingLocalWrites || activeOps > 0);
}
function beginOp() { activeOps++; refreshSync(); }
function endOp() { activeOps = Math.max(0, activeOps - 1); refreshSync(); }
window.addEventListener("online", () => { refreshNet(); flushPhotoQueue(); });
window.addEventListener("offline", refreshNet);
refreshNet();

/* ---------- 状態 ---------- */
let currentUser = null;
let myCompanyId = null;
let projectRef = null;
let lastMemo = "";
let unsubscribers = [];

const $ = (id) => document.getElementById(id);
const authView = $("authView"), appView = $("appView");

/* ---------- 認証 ---------- */
$("loginBtn").addEventListener("click", async () => {
  $("authMsg").textContent = "";
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
  } catch (e) {
    $("authMsg").textContent = "ログイン失敗: " + e.code;
  }
});
$("signupBtn").addEventListener("click", async () => {
  $("authMsg").textContent = "";
  try {
    await createUserWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
  } catch (e) {
    $("authMsg").textContent = "登録失敗: " + e.code;
  }
});
$("logoutBtn").addEventListener("click", () => signOut(auth));
$("saveCompanyBtn").addEventListener("click", async () => {
  const cid = $("companyIdInput").value.trim();
  if (!cid || !currentUser) return;
  try {
    await setDoc(doc(db, "users", currentUser.uid), {
      companyId: cid, email: currentUser.email
    });
    $("companySetup").hidden = true;
    await openProject(cid);
  } catch (e) {
    $("authMsg").textContent = "会社ID登録失敗: " + e.code;
  }
});

onAuthStateChanged(auth, async (user) => {
  unsubscribers.forEach((u) => u());
  unsubscribers = [];
  currentUser = user;
  projectRef = null;
  myCompanyId = null;

  if (!user) {
    authView.hidden = false;
    appView.hidden = true;
    $("logoutBtn").hidden = true;
    $("userEmail").textContent = "";
    return;
  }
  authView.hidden = true;
  $("logoutBtn").hidden = false;
  $("userEmail").textContent = user.email ?? "";

  // 所属会社（users/{uid}）を確認。無ければ登録フォームを出す
  let companyId = null;
  try {
    const usnap = await getDoc(doc(db, "users", user.uid));
    if (usnap.exists()) companyId = usnap.data().companyId ?? null;
  } catch (e) {
    // オフライン初回など。登録フォーム側で扱う
  }
  if (!companyId) {
    $("companySetup").hidden = false;
    appView.hidden = true;
    return;
  }
  $("companySetup").hidden = true;
  await openProject(companyId);
});

/* ---------- テスト案件 ---------- */
async function openProject(companyId) {
  myCompanyId = companyId;
  const projectId = "test-" + companyId.replace(/[^a-zA-Z0-9_-]/g, "-");
  projectRef = doc(db, "projects", projectId);
  appView.hidden = false;

  try {
    const snap = await getDoc(projectRef);
    if (!snap.exists()) {
      await setDoc(projectRef, {
        companyId,
        title: "テスト案件",
        memo: "",
        updatedAt: serverTimestamp(),
        updatedBy: currentUser.email
      });
    }
  } catch (e) {
    $("saveMsg").textContent = "案件の読み込み失敗: " + e.code;
  }

  // 案件（メモ）の購読：他端末の変更がここに反映される
  unsubscribers.push(onSnapshot(projectRef, (s) => {
    pendingLocalWrites = s.metadata.hasPendingWrites;
    refreshSync();
    if (!s.exists()) return;
    const data = s.data();
    $("projectTitle").textContent = data.title ?? "テスト案件";
    lastMemo = data.memo ?? "";
    // 編集中でないときだけ、他端末の変更をテキスト欄へ反映する
    if (document.activeElement !== $("memo")) {
      $("memo").value = lastMemo;
    }
  }, (e) => {
    $("saveMsg").textContent = "購読失敗: " + e.code;
  }));

  // 変更履歴の購読
  const historyQuery = query(collection(projectRef, "history"), orderBy("at", "desc"), limit(20));
  unsubscribers.push(onSnapshot(historyQuery, (qs) => {
    const ul = $("historyList");
    ul.textContent = "";
    qs.forEach((d) => {
      const h = d.data();
      const li = document.createElement("li");
      const when = h.at && typeof h.at.toDate === "function" ? h.at.toDate().toLocaleString("ja-JP") : "";
      li.textContent = `${when} ${h.email ?? ""}： 「${h.before ?? ""}」→「${h.after ?? ""}」`;
      ul.appendChild(li);
    });
  }));

  // 写真メタデータの購読
  const photosQuery = query(collection(projectRef, "photos"), orderBy("uploadedAt", "desc"), limit(50));
  unsubscribers.push(onSnapshot(photosQuery, async (qs) => {
    const box = $("photoList");
    box.textContent = "";
    for (const d of qs.docs) {
      const p = d.data();
      const img = document.createElement("img");
      img.alt = p.name ?? "";
      try {
        img.src = await getDownloadURL(ref(storage, p.storagePath));
      } catch (e) { /* 表示だけの問題なので続行 */ }
      box.appendChild(img);
    }
  }));

  renderQueueCount();
  flushPhotoQueue();
}

/* ---------- メモ保存＋変更履歴 ---------- */
$("saveBtn").addEventListener("click", () => {
  if (!projectRef || !currentUser) return;
  $("saveMsg").textContent = "";
  const before = lastMemo;
  const after = $("memo").value;
  // オフライン時はローカルへ書き込まれ、復帰後に自動で同期される。
  // 完了を待たずに履歴も積む（履歴も同じくローカル→同期）。
  updateDoc(projectRef, {
    memo: after,
    updatedAt: serverTimestamp(),
    updatedBy: currentUser.email
  }).catch((e) => { $("saveMsg").textContent = "保存失敗: " + e.code; });
  addDoc(collection(projectRef, "history"), {
    field: "memo",
    before, after,
    uid: currentUser.uid,
    email: currentUser.email,
    at: serverTimestamp()
  }).catch((e) => { $("saveMsg").textContent = "履歴の記録失敗: " + e.code; });
  lastMemo = after;
});

/* ---------- 写真：保留キュー（IndexedDB）→ Storage ---------- */
const IDB_NAME = "phase0-photo-queue";
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore("photos", { keyPath: "id" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbAll() {
  const dbi = await idbOpen();
  return new Promise((resolve, reject) => {
    const req = dbi.transaction("photos").objectStore("photos").getAll();
    req.onsuccess = () => resolve(req.result ?? []);
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(item) {
  const dbi = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = dbi.transaction("photos", "readwrite");
    tx.objectStore("photos").put(item);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbDelete(id) {
  const dbi = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = dbi.transaction("photos", "readwrite");
    tx.objectStore("photos").delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function renderQueueCount() {
  try {
    const items = await idbAll();
    const n = projectRef ? items.filter((i) => i.projectId === projectRef.id).length : items.length;
    $("queueMsg").textContent = n > 0 ? `送信待ち ${n} 件` : "";
  } catch (e) { /* キュー表示だけの問題 */ }
}

async function enqueuePhoto(file) {
  if (!file || !projectRef) return;
  await idbPut({
    id: crypto.randomUUID(),
    projectId: projectRef.id,
    companyId: myCompanyId,
    name: file.name || `photo-${Date.now()}.jpg`,
    type: file.type || "image/jpeg",
    blob: file,
    createdAt: Date.now()
  });
  renderQueueCount();
  flushPhotoQueue();
}

let flushing = false;
async function flushPhotoQueue() {
  if (flushing || !navigator.onLine || !projectRef || !currentUser) return;
  flushing = true;
  try {
    const items = (await idbAll())
      .filter((i) => i.projectId === projectRef.id)
      .sort((a, b) => a.createdAt - b.createdAt);
    for (const item of items) {
      beginOp();
      try {
        const storagePath = `companies/${item.companyId}/projects/${item.projectId}/photos/${item.id}-${item.name}`;
        await uploadBytes(ref(storage, storagePath), item.blob, { contentType: item.type });
        await addDoc(collection(projectRef, "photos"), {
          storagePath,
          name: item.name,
          uploadedBy: currentUser.email,
          uploadedAt: serverTimestamp()
        });
        await idbDelete(item.id);
      } catch (e) {
        // 失敗した写真はキューに残し、次回のオンライン復帰時に再送する
      } finally {
        endOp();
      }
    }
  } finally {
    flushing = false;
    renderQueueCount();
  }
}

$("photoPickBtn").addEventListener("click", () => $("photoInput").click());
$("cameraBtn").addEventListener("click", () => $("cameraInput").click());
$("photoInput").addEventListener("change", (e) => { enqueuePhoto(e.target.files[0]); e.target.value = ""; });
$("cameraInput").addEventListener("change", (e) => { enqueuePhoto(e.target.files[0]); e.target.value = ""; });
</script>
</body>
</html>
